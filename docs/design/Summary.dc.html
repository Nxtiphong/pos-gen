<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สรุปยอดวันนี้</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
a{color:#B33A0A}a:hover{color:#8A2C07}
</style>
</helmet>
<div style="width: 1194px; height: 834px; display: flex; background: #F3F4F1; color: #1C1D1A; font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif; overflow: hidden; font-variant-numeric: tabular-nums">

  <nav aria-label="เมนูหลัก" style="width: 88px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E3E5E0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 0; box-sizing: border-box">
    <div aria-hidden="true" style="width: 48px; height: 48px; border-radius: 14px; background: #1C1D1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-bottom: 16px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l1.5-5h13L20 9"></path><path d="M4 9h16"></path><path d="M5 9v11h14V9"></path><path d="M10 20v-5h4v5"></path></svg>
    </div>
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px; padding: 10px 0; border-radius: 14px; color: #5F6360; text-decoration: none; font-size: 13px; font-weight: 500">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"></path><path d="M9 7a3 3 0 0 1 6 0"></path></svg>
      ขาย
    </a>
    <a href="Orders.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px; padding: 10px 0; border-radius: 14px; color: #5F6360; text-decoration: none; font-size: 13px; font-weight: 500">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"></path><path d="M9 8h6M9 12h6"></path></svg>
      ออเดอร์
    </a>
    <a href="Summary.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px; padding: 10px 0; border-radius: 14px; background: #FFF1E8; color: #B33A0A; text-decoration: none; font-size: 13px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"></path><path d="M7 16v-5M12 16V6M17 16v-8"></path></svg>
      สรุปยอด
    </a>
    <a href="Products.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 72px; padding: 10px 0; border-radius: 14px; color: #5F6360; text-decoration: none; font-size: 13px; font-weight: 500">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"></path><path d="M3 7v10l9 4 9-4V7"></path><path d="M12 11v10"></path></svg>
      สินค้า
    </a>
  </nav>

  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px; box-sizing: border-box">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700">สรุปยอดวันนี้</h1>
      <button type="button" style="height: 44px; padding: 0 14px 0 18px; border-radius: 12px; border: 1px solid #E3E5E0; background: #FFFFFF; color: #1C1D1A; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer">
        พฤ. 5 พ.ย. 2569
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <dl style="margin: 0; display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px">
      <div style="background: #1C1D1A; color: #FFFFFF; border-radius: 22px; padding: 22px 24px; display: flex; flex-direction: column; gap: 4px">
        <dt style="font-size: 16px; color: #C9CCC5">ยอดขายรวม (เงินสด)</dt>
        <dd style="margin: 0; font-size: 52px; font-weight: 700; line-height: 1.1">฿4,280</dd>
      </div>
      <div style="background: #FFFFFF; border-radius: 22px; padding: 22px 24px; display: flex; flex-direction: column; gap: 4px">
        <dt style="font-size: 16px; color: #5F6360">จำนวนบิล</dt>
        <dd style="margin: 0; font-size: 44px; font-weight: 700; line-height: 1.15">63</dd>
      </div>
      <div style="background: #FFFFFF; border-radius: 22px; padding: 22px 24px; display: flex; flex-direction: column; gap: 4px">
        <dt style="font-size: 16px; color: #5F6360">ชิ้นที่ขายได้</dt>
        <dd style="margin: 0; font-size: 44px; font-weight: 700; line-height: 1.15">365</dd>
      </div>
    </dl>

    <div style="flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <section style="background: #FFFFFF; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
        <h2 style="margin: 0; font-size: 20px; font-weight: 700">สินค้าขายดี</h2>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 18px">
          <sc-for list="{{top}}" as="t" hint-placeholder-count="5">
            <li style="display: flex; flex-direction: column; gap: 8px">
              <div style="display: flex; align-items: baseline; gap: 10px">
                <span style="width: 20px; font-size: 15px; font-weight: 700; color: #5F6360">{{t.rank}}</span>
                <span style="flex: 1; font-size: 18px; font-weight: 600">{{t.name}}</span>
                <span style="font-size: 15px; color: #5F6360">{{t.qty}}</span>
                <span style="width: 76px; text-align: right; font-size: 18px; font-weight: 700">{{t.amount}}</span>
              </div>
              <div aria-hidden="true" style="margin-left: 30px; height: 8px; border-radius: 999px; background: #F0F1EE">
                <div style="height: 8px; border-radius: 999px; background: {{t.color}}; width: {{t.pct}}"></div>
              </div>
            </li>
          </sc-for>
        </ol>
      </section>

      <section style="background: #FFFFFF; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700">ยอดขายรายชั่วโมง</h2>
          <span style="font-size: 14px; color: #5F6360">ขายดีสุด 07:00–08:00</span>
        </div>
        <div role="img" aria-label="ยอดขายรายชั่วโมง 06:00 ถึง 11:00 สูงสุดช่วง 07:00 ฿1,240" style="flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; align-items: end; padding-top: 12px">
          <sc-for list="{{hours}}" as="h" hint-placeholder-count="6">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
              <span style="font-size: 13px; font-weight: 600; color: {{h.labelColor}}">{{h.value}}</span>
              <div style="width: 100%; max-width: 52px; border-radius: 10px 10px 4px 4px; background: {{h.color}}; height: {{h.height}}"></div>
              <span style="font-size: 14px; color: #5F6360">{{h.hour}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  renderVals() {
    const money = (n) => '฿' + n.toLocaleString('en-US');
    const topRaw = [
      { name: 'หมูปิ้ง', qty: '182 ไม้', amount: 1820 },
      { name: 'ข้าวเหนียว', qty: '96 ห่อ', amount: 960 },
      { name: 'ชาเย็น', qty: '28 แก้ว', amount: 700 },
      { name: 'ไก่ทอด', qty: '21 ชิ้น', amount: 420 },
      { name: 'ลูกชิ้นปิ้ง', qty: '38 ไม้', amount: 380 }
    ];
    const maxTop = topRaw[0].amount;
    const top = topRaw.map((t, i) => ({
      rank: i + 1,
      name: t.name,
      qty: t.qty,
      amount: money(t.amount),
      pct: Math.round((t.amount / maxTop) * 100) + '%',
      color: i === 0 ? '#C4410C' : '#8C918D'
    }));
    const hourRaw = [
      { hour: '06:00', v: 620 },
      { hour: '07:00', v: 1240 },
      { hour: '08:00', v: 980 },
      { hour: '09:00', v: 560 },
      { hour: '10:00', v: 520 },
      { hour: '11:00', v: 360 }
    ];
    const maxH = 1240;
    const hours = hourRaw.map((h) => ({
      hour: h.hour,
      value: money(h.v),
      height: Math.round((h.v / maxH) * 300) + 'px',
      color: h.v === maxH ? '#C4410C' : '#8C918D',
      labelColor: h.v === maxH ? '#B33A0A' : '#5F6360'
    }));
    return { top: top, hours: hours };
  }
}
</script>
</body>
</html>
