<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ของพร้อมแล้ว</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
a{color:#FFFFFF}a:hover{color:#E6F4EC}
@keyframes readyring{0%{transform:scale(1);opacity:0.55}100%{transform:scale(1.9);opacity:0}}
@keyframes readyshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.ready-ring{animation:readyring 1.4s ease-out infinite}
.ready-ring.r2{animation-delay:0.7s}
.ready-bell{animation:readyshake 0.9s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; align-items: center; gap: 22px; background: {{bg}}; color: #FFFFFF; font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif; overflow: hidden; font-variant-numeric: tabular-nums; text-align: center">

  <header style="align-self: stretch; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 4px">
    <span style="font-size: 17px; font-weight: 700">[ชื่อร้าน]</span>
    <span style="font-size: 14px; color: #E6F4EC">บิลของคุณ</span>
  </header>

  <div aria-hidden="true" style="position: relative; width: 132px; height: 132px; margin-top: 36px; display: flex; align-items: center; justify-content: center">
    <sc-if value="{{ringing}}" hint-placeholder-val="{{true}}">
      <span class="ready-ring" style="position: absolute; inset: 0; border-radius: 999px; border: 3px solid #FFFFFF"></span>
      <span class="ready-ring r2" style="position: absolute; inset: 0; border-radius: 999px; border: 3px solid #FFFFFF"></span>
    </sc-if>
    <span style="position: relative; width: 132px; height: 132px; border-radius: 999px; background: #FFFFFF; color: {{bg}}; display: flex; align-items: center; justify-content: center">
      <sc-if value="{{ringing}}" hint-placeholder-val="{{true}}">
        <svg class="ready-bell" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2z"></path><path d="M10 21h4"></path></svg>
      </sc-if>
      <sc-if value="{{stopped}}" hint-placeholder-val="{{false}}">
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
      </sc-if>
    </span>
  </div>

  <div role="alert" style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 38px; font-weight: 700; line-height: 1.2">ของพร้อมแล้ว!</h1>
    <p style="margin: 0; font-size: 18px; color: #E6F4EC">มารับที่หน้าร้านได้เลย</p>
  </div>

  <div style="align-self: stretch; background: #FFFFFF; border-radius: 28px; padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 2px; color: #1C1D1A">
    <span style="font-size: 15px; color: #5F6360">แสดงเลขนี้ให้พนักงาน</span>
    <span style="font-size: 96px; font-weight: 700; line-height: 1; letter-spacing: -1px; color: {{bg}}">A023</span>
    <span style="font-size: 15px; color: #5F6360">หมูปิ้ง × 4 · ข้าวเหนียว × 2 · ชาเย็น × 1 · ฿85</span>
  </div>

  <sc-if value="{{ringing}}" hint-placeholder-val="{{true}}">
    <button type="button" onClick="{{stop}}" style="align-self: stretch; margin-top: auto; height: 60px; border-radius: 18px; border: 2px solid #FFFFFF; background: transparent; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 9.5-4.9"></path><path d="M18 11v5l2 2H8"></path><path d="M10 21h4"></path><path d="M4 4l16 16"></path></svg>
      ปิดเสียงเตือน
    </button>
  </sc-if>
  <sc-if value="{{stopped}}" hint-placeholder-val="{{false}}">
    <p role="status" style="align-self: stretch; margin: auto 0 0; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; color: #E6F4EC">ปิดเสียงแล้ว · ขอบคุณที่อุดหนุน</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"readyColor":{"editor":"color","default":"#157347","options":["#157347","#1D4ED8","#C4410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const stopped = !!s.stopped;
    return {
      bg: this.props.readyColor ?? '#157347',
      ringing: !stopped,
      stopped: stopped,
      stop: () => this.setState({ stopped: true })
    };
  }
}
</script>
</body>
</html>
