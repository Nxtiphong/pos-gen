<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>คิดเงิน</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
a{color:#B33A0A}a:hover{color:#8A2C07}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px; background: #F3F4F1; color: #1C1D1A; font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif; overflow: hidden; font-variant-numeric: tabular-nums">

  <header style="display: flex; align-items: center; gap: 16px">
    <a href="Sell-Cart.dc.html" style="height: 48px; padding: 0 18px 0 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E5E0; color: #1C1D1A; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
      แก้รายการ
    </a>
    <h1 style="margin: 0; font-size: 28px; font-weight: 700">คิดเงิน</h1>
    <span style="font-size: 18px; color: #5F6360">ออเดอร์ #A023</span>
  </header>

  <div style="flex: 1; min-height: 0; display: flex; gap: 20px">

    <section aria-label="สรุปรายการ" style="width: 400px; flex-shrink: 0; background: #FFFFFF; border-radius: 24px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
      <h2 style="margin: 0; font-size: 18px; font-weight: 600; color: #5F6360">รายการ (7 ชิ้น)</h2>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px">
        <li style="display: flex; justify-content: space-between; gap: 12px; font-size: 18px"><span>หมูปิ้ง <span style="color: #5F6360">× 4</span></span><span style="font-weight: 600">฿40</span></li>
        <li style="display: flex; justify-content: space-between; gap: 12px; font-size: 18px"><span>ข้าวเหนียว <span style="color: #5F6360">× 2</span></span><span style="font-weight: 600">฿20</span></li>
        <li style="display: flex; justify-content: space-between; gap: 12px; font-size: 18px"><span>ชาเย็น <span style="color: #5F6360">× 1</span></span><span style="font-weight: 600">฿25</span></li>
      </ul>
      <div style="height: 1px; background: #E3E5E0"></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 16px; color: #5F6360">ยอดที่ต้องชำระ</span>
        <span style="font-size: 56px; font-weight: 700; line-height: 1.1">฿85</span>
      </div>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 15px; color: #5F6360">ช่องทางชำระ</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <button type="button" aria-pressed="true" style="height: 56px; border-radius: 14px; border: 2px solid #1C1D1A; background: #1C1D1A; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
            <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>
            เงินสด
          </button>
          <button type="button" disabled="" style="height: 56px; border-radius: 14px; border: 1px dashed #C9CCC5; background: #FFFFFF; color: #5F6360; font-size: 15px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2">
            PromptPay
            <span style="font-size: 12px">ยังไม่เปิดใช้</span>
          </button>
        </div>
      </div>
    </section>

    <section aria-label="รับเงิน" style="flex: 1; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="border-radius: 18px; border: 2px solid #1C1D1A; padding: 14px 20px; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; color: #5F6360">รับเงินมา</span>
          <output aria-live="polite" style="font-size: 48px; font-weight: 700; line-height: 1.15">{{receivedLabel}}</output>
        </div>
        <sc-if value="{{enough}}" hint-placeholder-val="{{true}}">
          <div style="border-radius: 18px; background: #E8F4EC; padding: 16px 20px; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; color: #135F3B">เงินทอน</span>
            <output aria-live="polite" style="font-size: 48px; font-weight: 700; line-height: 1.15; color: #135F3B">{{changeLabel}}</output>
          </div>
        </sc-if>
        <sc-if value="{{short}}" hint-placeholder-val="{{false}}">
          <div style="border-radius: 18px; background: #FFF1E8; padding: 16px 20px; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; color: #8A2C07">ยังขาดอีก</span>
            <output aria-live="polite" style="font-size: 48px; font-weight: 700; line-height: 1.15; color: #8A2C07">{{shortLabel}}</output>
          </div>
        </sc-if>
      </div>

      <div role="group" aria-label="จำนวนเงินด่วน" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
          <button type="button" onClick="{{q.pick}}" style="height: 56px; border-radius: 14px; border: 1px solid {{q.border}}; background: {{q.bg}}; color: {{q.fg}}; font-size: 18px; font-weight: 600; cursor: pointer">{{q.label}}</button>
        </sc-for>
      </div>

      <div role="group" aria-label="แป้นตัวเลข" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
          <button type="button" onClick="{{k.press}}" aria-label="{{k.aria}}" style="height: 62px; border-radius: 14px; border: none; background: #F3F4F1; color: #1C1D1A; font-size: 26px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <sc-if value="{{k.isBack}}" hint-placeholder-val="{{false}}">
              <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11v12H9l-6-6 6-6z"></path><path d="M13 10l4 4M17 10l-4 4"></path></svg>
            </sc-if>
            <sc-if value="{{k.isDigit}}" hint-placeholder-val="{{true}}">{{k.label}}</sc-if>
          </button>
        </sc-for>
      </div>

      <sc-if value="{{enough}}" hint-placeholder-val="{{true}}">
        <a href="Paid-QR.dc.html" style="margin-top: auto; height: 68px; border-radius: 18px; background: #C4410C; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; font-weight: 700">
          <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          ชำระเสร็จ · ทอน {{changeLabel}}
        </a>
      </sc-if>
      <sc-if value="{{short}}" hint-placeholder-val="{{false}}">
        <button type="button" disabled="" style="margin-top: auto; height: 68px; border-radius: 18px; border: none; background: #E3E5E0; color: #5F6360; font-size: 22px; font-weight: 700">ใส่เงินที่รับมาให้ครบก่อน</button>
      </sc-if>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  getReceived() {
    const s = this.state || {};
    return s.received !== undefined ? s.received : '100';
  }
  setReceived(v) { this.setState({ received: v }); }
  renderVals() {
    const total = 85;
    const money = (n) => '฿' + n.toLocaleString('en-US');
    const r = this.getReceived();
    const amount = r === '' ? 0 : parseInt(r, 10);
    const diff = amount - total;
    const quickVals = [
      { label: 'พอดี ฿85', v: 85 },
      { label: '฿100', v: 100 },
      { label: '฿500', v: 500 },
      { label: '฿1,000', v: 1000 }
    ];
    const quick = quickVals.map((q) => {
      const on = amount === q.v;
      return {
        label: q.label,
        border: on ? '#1C1D1A' : '#E3E5E0',
        bg: on ? '#1C1D1A' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#1C1D1A',
        pick: () => this.setReceived(String(q.v))
      };
    });
    const digits = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0'];
    const keys = digits.map((d) => ({
      label: d, aria: d, isDigit: true, isBack: false,
      press: () => {
        const cur = this.getReceived();
        const next = (cur === '0' ? '' : cur) + d;
        if (next.length <= 6 && next !== '00') this.setReceived(String(parseInt(next, 10)));
      }
    }));
    keys.push({
      label: '', aria: 'ลบ', isDigit: false, isBack: true,
      press: () => this.setReceived(this.getReceived().slice(0, -1))
    });
    return {
      receivedLabel: money(amount),
      changeLabel: money(Math.max(diff, 0)),
      shortLabel: money(Math.max(-diff, 0)),
      enough: diff >= 0,
      short: diff < 0,
      quick: quick,
      keys: keys
    };
  }
}
</script>
</body>
</html>
